<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · OSIS Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div style="margin-bottom: 1.25rem;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;" aria-label="Back to OSIS Home">
          <div class="brand-icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <span>OSIS</span>
        </a>
        <p style="font-size: 0.8125rem; color: var(--neutral-500);"><a href="index.html" style="color: var(--neutral-500); text-decoration: none;">&larr; Back to Home</a></p>
    </div>

    <h2>Welcome Back</h2>

    <form id="loginForm">
        <input type="text" id="email" placeholder="Username or Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
        <p id="message"></p>
    </form>

    <p>Don't have an account?
        <a href="register.html">Register</a>
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const identity = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    const users = JSON.parse(localStorage.getItem("users") || "[]");

    const data = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hash = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0")).join("");

    const user = users.find(u =>
        (u.username.toLowerCase() === identity.toLowerCase() ||
         u.email === identity.toLowerCase()) &&
        u.passwordHash === hash
    );

    if (!user) {
        message.textContent = "Invalid username/email or password.";
        return;
    }

    sessionStorage.setItem("loggedInUser", user.username);
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
